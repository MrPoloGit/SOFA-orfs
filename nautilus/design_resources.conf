# Per-design resource sizing for Kubernetes Jobs on NRP Nautilus.
#
# Format: <design>  KEY=VALUE [KEY=VALUE ...]
#   design       — directory name under designs/ (sofa_hd | qlsofa_hd | sofa_chd)
#                  or "defaults" for fallback values
#   cpu_req/lim  — CPU cores
#   mem_req/lim  — memory (Gi suffix)
#   eph_req/lim  — ephemeral storage (Gi suffix)
#
# Sizing rationale
# ----------------
# SOFA fabrics are large FPGA mux-tree designs: 4–12M cell instances.
# For reference, bp_quad (4-core BlackParrot, ~560 macros) peaked at 113 GB
# during 5_route on HighTide/Nautilus. SOFA HD is all-standard-cell with a
# smaller instance count but very high routing congestion — expect 60–100 GB
# peak during global routing.
#
# Routing is the memory spike: FastRoute holds the full netlist + routing
# graph in memory simultaneously. All-standard-cell designs spike higher
# than macro-dominated ones at similar cell counts.
#
# Start with these values and bump if a job OOMKills (exit 137).

# Defaults — not used directly, sofa designs all have explicit entries below
defaults       cpu_req=8  cpu_lim=16  mem_req=32Gi  mem_lim=64Gi   eph_req=50Gi  eph_lim=100Gi

# SOFA HD — 12x12 CLB, W=40, ~4–8M instances
# Route stage is the bottleneck; 64Gi base with 128Gi headroom.
sofa_hd        cpu_req=16 cpu_lim=32  mem_req=64Gi  mem_lim=128Gi  eph_req=100Gi eph_lim=200Gi

# QLSOFA HD — 12x12 CLB, W=60, ~6–12M instances (50% more routing muxes)
# Larger die + more cells → bump memory. 96Gi req based on bp_quad scaling.
qlsofa_hd      cpu_req=16 cpu_lim=32  mem_req=96Gi  mem_lim=192Gi  eph_req=150Gi eph_lim=250Gi

# SOFA CHD — W=60 + CPL custom cells; similar scale to qlsofa_hd
# CPL cells are more compact but routing graph is the same size.
sofa_chd       cpu_req=16 cpu_lim=32  mem_req=96Gi  mem_lim=192Gi  eph_req=150Gi eph_lim=250Gi
